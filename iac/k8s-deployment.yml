apiVersion: v1
kind: Namespace
metadata:
  name: myapp
  labels:
    name: myapp
    environment: production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: myapp-serviceaccount
  namespace: myapp
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: myapp-secrets
  namespace: myapp
  annotations:
    kubernetes.io/change-cause: "Initial secrets deployment"
type: Opaque
stringData:
  # Настройки базы данных
  database-url: "postgresql://${DB_USER}:${DB_PASSWORD}@myapp-postgres-service:5432/${DB_NAME}"
  postgres-user: "${DB_USER}"
  postgres-password: "${DB_PASSWORD}"
  postgres-db: "${DB_NAME}"
  # Настройки приложения
  app-secret-key: "${APP_SECRET_KEY}"
  debug: "false"
  python-unbuffered: "1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: myapp-config
  namespace: myapp
data:
  app-name: "MyApp"
  environment: "production"
  log-level: "INFO"
  host: "0.0.0.0"
  port: "8000"
  database-host: "myapp-postgres-service"
  database-port: "5432"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment
  namespace: myapp
  labels:
    app: myapp
    component: backend
    version: v1.0.0
    environment: production
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: myapp
      component: backend
  template:
    metadata:
      labels:
        app: myapp
        component: backend
        version: v1.0.0
    spec:
      serviceAccountName: myapp-serviceaccount
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        sysctls:
          - name: net.core.somaxconn
            value: "1024"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - myapp
                topologyKey: kubernetes.io/hostname
      containers:
      - name: app
        image: myapp:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: myapp-secrets
              key: database-url
        - name: PYTHONUNBUFFERED
          valueFrom:
            secretKeyRef:
              name: myapp-secrets
              key: python-unbuffered
        - name: HOST
          valueFrom:
            configMapKeyRef:
              name: myapp-config
              key: host
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: myapp-config
              key: port
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: myapp-config
              key: database-host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: myapp-config
              key: database-port
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
            ephemeral-storage: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        startupProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: app-data
          mountPath: /app/data
          readOnly: false
        - name: tmp
          mountPath: /tmp
          readOnly: false
        - name: logs
          mountPath: /app/logs
          readOnly: false
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
      volumes:
      - name: app-data
        emptyDir:
          sizeLimit: 1Gi
          medium: Memory
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi
          medium: Memory
      - name: logs
        emptyDir:
          sizeLimit: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-postgres
  namespace: myapp
  labels:
    app: myapp-postgres
    component: database
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp-postgres
      component: database
  template:
    metadata:
      labels:
        app: myapp-postgres
        component: database
        tier: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: myapp-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: myapp-secrets
              key: postgres-password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: myapp-secrets
              key: postgres-db
        - name: POSTGRES_INITDB_ARGS
          value: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
        ports:
        - containerPort: 5432
          name: postgres
          protocol: TCP
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
          readOnly: false
        - name: postgres-tmp
          mountPath: /tmp
          readOnly: false
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: postgres-tmp
        emptyDir:
          sizeLimit: 200Mi
---
apiVersion: v1
kind: Service
metadata:
  name: myapp-service
  namespace: myapp
  labels:
    app: myapp
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: myapp
    component: backend
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: myapp-postgres-service
  namespace: myapp
  labels:
    app: myapp-postgres
    component: database
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: myapp-postgres
    component: database
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: myapp
  labels:
    app: myapp-postgres
    component: database
    storage: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
  selector:
    matchLabels:
      type: local
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: myapp-network-policy
  namespace: myapp
spec:
  podSelector:
    matchLabels:
      app: myapp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: myapp
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: myapp-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
