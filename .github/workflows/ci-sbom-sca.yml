name: SBOM & SCA Scanning
on:
  push:
    branches: [ main ]
    paths:
      - 'requirements.txt'
      - 'Pipfile'
      - 'Pipfile.lock'
      - 'poetry.lock'
      - 'pyproject.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'go.mod'
      - 'Cargo.toml'
      - 'pom.xml'
      - 'build.gradle'
      - '**/*.py'
      - '.github/workflows/ci-sbom-sca.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'requirements.txt'
      - 'Pipfile'
      - 'Pipfile.lock'
      - 'poetry.lock'
      - 'pyproject.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'go.mod'
      - 'Cargo.toml'
      - 'pom.xml'
      - 'build.gradle'
      - '**/*.py'
      - '.github/workflows/ci-sbom-sca.yml'
  workflow_dispatch:  # Ручной запуск

# Отменяем старые запуски при новом push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom-sca:
    name: Generate SBOM and SCA scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create evidence directory
        run: |
          mkdir -p EVIDENCE/P09

      - name: Generate SBOM with Syft
        id: sbom
        uses: anchore/sbom-action@v0
        with:
          path: "."
          output-format: "cyclonedx-json"
          output-file: "EVIDENCE/P09/sbom.json"
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"

      - name: Run SCA scan with Grype (using SBOM)
        id: sca
        run: |
          # Скачиваем и устанавливаем Grype
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

          # Выполняем сканирование на основе SBOM
          grype sbom:EVIDENCE/P09/sbom.json \
            --output json \
            --file EVIDENCE/P09/sca_report.json

          # Генерируем сводку в human-readable формате
          grype sbom:EVIDENCE/P09/sbom.json \
            --output table \
            --file EVIDENCE/P09/sca_summary.txt

      - name: Generate markdown summary
        run: |
          # Создаем сводку в формате Markdown
          echo "# SCA Scan Summary" > EVIDENCE/P09/sca_summary.md
          echo "" >> EVIDENCE/P09/sca_summary.md
          echo "**Scan Date:** $(date)" >> EVIDENCE/P09/sca_summary.md
          echo "**Commit SHA:** ${{ github.sha }}" >> EVIDENCE/P09/sca_summary.md
          echo "**SBOM Generated:** ✅" >> EVIDENCE/P09/sca_summary.md
          echo "**SCA Completed:** ✅" >> EVIDENCE/P09/sca_summary.md
          echo "" >> EVIDENCE/P09/sca_summary.md

          # Если есть уязвимости, анализируем отчет
          if [ -f EVIDENCE/P09/sca_report.json ]; then
            echo "## Vulnerability Severity Distribution" >> EVIDENCE/P09/sca_summary.md
            echo "" >> EVIDENCE/P09/sca_summary.md

            # Используем jq для анализа отчета
            if command -v jq &> /dev/null; then
              sudo apt-get install -y jq
            fi

            # Подсчитываем уязвимости по уровню серьезности
            echo '```' >> EVIDENCE/P09/sca_summary.md
            jq -r '
              [.matches[] | .vulnerability.severity] |
              group_by(.) |
              map({severity: .[0], count: length}) |
              sort_by(.severity) |
              .[] | "\(.severity): \(.count)"' \
              EVIDENCE/P09/sca_report.json 2>/dev/null || echo "Не удалось проанализировать отчет" \
              >> EVIDENCE/P09/sca_summary.md
            echo '```' >> EVIDENCE/P09/sca_summary.md
            echo "" >> EVIDENCE/P09/sca_summary.md

            # Выводим топ-5 критических уязвимостей
            echo "## Top Critical/High Vulnerabilities" >> EVIDENCE/P09/sca_summary.md
            echo "" >> EVIDENCE/P09/sca_summary.md
            echo '```' >> EVIDENCE/P09/sca_summary.md
            jq -r '
              .matches |
              map(select(.vulnerability.severity == "Critical" or .vulnerability.severity == "High")) |
              sort_by(.vulnerability.severity) |
              .[0:5] |
              .[] | "\(.vulnerability.severity): \(.vulnerability.id) - \(.artifact.name)@\(.artifact.version)"' \
              EVIDENCE/P09/sca_report.json 2>/dev/null || echo "Критических уязвимостей не найдено" \
              >> EVIDENCE/P09/sca_summary.md
            echo '```' >> EVIDENCE/P09/sca_summary.md
          else
            echo "## No vulnerabilities found" >> EVIDENCE/P09/sca_summary.md
            echo "SCA scan completed successfully. No vulnerabilities detected." >> EVIDENCE/P09/sca_summary.md
          fi

          echo "" >> EVIDENCE/P09/sca_summary.md
          echo "## Next Steps" >> EVIDENCE/P09/sca_summary.md
          echo "1. Review the full SCA report in `sca_report.json`" >> EVIDENCE/P09/sca_summary.md
          echo "2. For Critical/High vulnerabilities:" >> EVIDENCE/P09/sca_summary.md
          echo "   - Update dependencies if possible" >> EVIDENCE/P09/sca_summary.md
          echo "   - Create waivers in `policy/waivers.yml` if remediation is not possible" >> EVIDENCE/P09/sca_summary.md
          echo "3. Integrate findings into your risk assessment" >> EVIDENCE/P09/sca_summary.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-sca-evidence
          path: |
            EVIDENCE/P09/
          retention-days: 30

      - name: Display summary
        run: |
          echo "=== SBOM & SCA Scan Complete ==="
          echo "SBOM saved to: EVIDENCE/P09/sbom.json"
          echo "SCA report saved to: EVIDENCE/P09/sca_report.json"
          echo "Summary saved to: EVIDENCE/P09/sca_summary.md"
          echo "Artifacts uploaded to GitHub Actions"
          echo "==================================="
