name: SAST & Secrets Scanning
on:
  push:
    branches: [ main ]
    paths:
      - '**/*.py'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.go'
      - '**/*.java'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.json'
      - '**/*.toml'
      - 'security/**'
      - '.github/workflows/ci-sast-secrets.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.py'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.go'
      - '**/*.java'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.json'
      - '**/*.toml'
      - 'security/**'
      - '.github/workflows/ci-sast-secrets.yml'
  workflow_dispatch:  # Ручной запуск

# Отменяем старые запуски
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-secrets:
    name: Run SAST and Secrets scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create evidence directory
        run: |
          mkdir -p EVIDENCE/P10
          mkdir -p security/semgrep

      - name: Run Semgrep SAST scan
        id: semgrep
        continue-on-error: true  # Не останавливать workflow при найденных уязвимостях
        run: |
          # Запускаем Semgrep с несколькими профилями
          docker run --rm -v "${PWD}:/src" returntocorp/semgrep semgrep scan \
            --config=p/ci \
            --config=p/security-audit \
            --config=p/secrets \
            --config=security/semgrep/rules.yml \
            --sarif \
            --output=EVIDENCE/P10/semgrep.sarif \
            --error

      - name: Run Gitleaks secrets scan
        id: gitleaks
        continue-on-error: true
        run: |
          # Используем официальный образ Gitleaks
          docker run --rm -v "${PWD}:/src" zricethezav/gitleaks:v8.18.2 detect \
            --source="/src" \
            --report-path="/src/EVIDENCE/P10/gitleaks.json" \
            --config="/src/security/.gitleaks.toml" \
            --verbose

      - name: Generate SAST summary
        run: |
          echo "# SAST & Secrets Scan Summary" > EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "**Scan Date:** $(date)" >> EVIDENCE/P10/sast_summary.md
          echo "**Commit SHA:** ${{ github.sha }}" >> EVIDENCE/P10/sast_summary.md
          echo "**Trigger:** ${{ github.event_name }}" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md

          # Анализ Semgrep результатов
          echo "## Semgrep SAST Results" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md
          if [ -f EVIDENCE/P10/semgrep.sarif ]; then
            echo "✅ SAST scan completed successfully" >> EVIDENCE/P10/sast_summary.md
            echo "" >> EVIDENCE/P10/sast_summary.md

            # Подсчитываем количество найденных проблем
            if command -v jq &> /dev/null; then
              sudo apt-get install -y jq
            fi

            # Извлекаем статистику из SARIF
            echo "### Findings Summary:" >> EVIDENCE/P10/sast_summary.md
            echo '```' >> EVIDENCE/P10/sast_summary.md
            echo "Total rules executed: $(jq '.runs[0].tool.driver.rules | length' EVIDENCE/P10/semgrep.sarif 2>/dev/null || echo 'N/A')" >> EVIDENCE/P10/sast_summary.md
            echo "Total findings: $(jq '.runs[0].results | length' EVIDENCE/P10/semgrep.sarif 2>/dev/null || echo 'N/A')" >> EVIDENCE/P10/sast_summary.md
            echo '```' >> EVIDENCE/P10/sast_summary.md

            # Анализ по severity
            echo "" >> EVIDENCE/P10/sast_summary.md
            echo "### Severity Distribution:" >> EVIDENCE/P10/sast_summary.md
            echo '```' >> EVIDENCE/P10/sast_summary.md
            jq -r '
              .runs[0].results[] | .level // "warning"
              | gsub("warning"; "Medium") | gsub("error"; "High")
            ' EVIDENCE/P10/semgrep.sarif 2>/dev/null | sort | uniq -c | sort -rn || echo "Unable to analyze severity" >> EVIDENCE/P10/sast_summary.md
            echo '```' >> EVIDENCE/P10/sast_summary.md
          else
            echo "❌ SAST scan failed or no results" >> EVIDENCE/P10/sast_summary.md
          fi

          echo "" >> EVIDENCE/P10/sast_summary.md

          # Анализ Gitleaks результатов
          echo "## Gitleaks Secrets Results" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md
          if [ -f EVIDENCE/P10/gitleaks.json ]; then
            echo "✅ Secrets scan completed successfully" >> EVIDENCE/P10/sast_summary.md
            echo "" >> EVIDENCE/P10/sast_summary.md

            # Проверяем, есть ли реальные секреты
            SECRETS_COUNT=$(jq '. | length' EVIDENCE/P10/gitleaks.json 2>/dev/null || echo "0")
            if [ "$SECRETS_COUNT" -eq 0 ] || [ "$SECRETS_COUNT" = "0" ]; then
              echo "✅ No secrets detected" >> EVIDENCE/P10/sast_summary.md
            else
              echo "⚠️ **Found $SECRETS_COUNT potential secrets**" >> EVIDENCE/P10/sast_summary.md
              echo "" >> EVIDENCE/P10/sast_summary.md
              echo "### Top secret types found:" >> EVIDENCE/P10/sast_summary.md
              echo '```' >> EVIDENCE/P10/sast_summary.md
              jq -r '.[].RuleID' EVIDENCE/P10/gitleaks.json 2>/dev/null | sort | uniq -c | sort -rn || echo "Unable to analyze secret types" >> EVIDENCE/P10/sast_summary.md
              echo '```' >> EVIDENCE/P10/sast_summary.md
            fi
          else
            echo "❌ Secrets scan failed or no results" >> EVIDENCE/P10/sast_summary.md
          fi

          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "## Next Steps" >> EVIDENCE/P10/sast_summary.md
          echo "1. Review findings in `semgrep.sarif` and `gitleaks.json`" >> EVIDENCE/P10/sast_summary.md
          echo "2. For Critical/High SAST findings:" >> EVIDENCE/P10/sast_summary.md
          echo "   - Fix code vulnerabilities immediately" >> EVIDENCE/P10/sast_summary.md
          echo "   - Or create backlog issues with timeline" >> EVIDENCE/P10/sast_summary.md
          echo "3. For detected secrets:" >> EVIDENCE/P10/sast_summary.md
          echo "   - Rotate compromised credentials immediately" >> EVIDENCE/P10/sast_summary.md
          echo "   - Add false positives to allowlist in `security/.gitleaks.toml`" >> EVIDENCE/P10/sast_summary.md
          echo "4. Integrate results into project documentation" >> EVIDENCE/P10/sast_summary.md

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sast-secrets-evidence
          path: |
            EVIDENCE/P10/
          retention-days: 30

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: EVIDENCE/P10/semgrep.sarif

      - name: Display scan summary
        run: |
          echo "=== SAST & Secrets Scan Complete ==="
          echo "Semgrep report: EVIDENCE/P10/semgrep.sarif"
          echo "Gitleaks report: EVIDENCE/P10/gitleaks.json"
          echo "Summary: EVIDENCE/P10/sast_summary.md"
          echo "Artifacts uploaded to GitHub Actions"
          echo "====================================="
