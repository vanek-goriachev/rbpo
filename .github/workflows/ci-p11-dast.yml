name: Security - DAST (P11, ZAP baseline)

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast_p11:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Prepare output directories
        run: mkdir -p EVIDENCE/P11

      - name: Configure runtime environment
        run: |
          cat << EOF > .env
          DB_HOST=postgres
          DB_PORT=5432
          DB_NAME=simpleblog
          DB_USER=simpleblog_user
          DB_PASSWORD=simpleblog_password
          DATABASE_URL=postgresql://simpleblog_user:simpleblog_password@postgres:5432/simpleblog
          EOF

      - name: Launch application containers
        run: |
          docker compose --profile=dev --env-file=.env up -d

      - name: Verify service availability
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'
          echo "Service ready for testing"

      - name: Validate connectivity
        run: |
          curl -f http://localhost:8000/health
          echo "Connection established"

      - name: Execute security assessment
        run: |
          # Locate application container
          APP_CONTAINER=$(docker compose ps -q app)
          if [ -z "$APP_CONTAINER" ]; then
            echo "Application container unavailable"
            docker compose ps
            exit 1
          fi

          # Determine container network
          NETWORK_NAME=$(docker inspect $APP_CONTAINER --format='{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' | head -1)

          if [ -z "$NETWORK_NAME" ]; then
            echo "Network configuration not found"
            exit 1
          fi

          echo "Assessment network: $NETWORK_NAME"

          # Prepare temporary storage
          mkdir -p scan-results
          chmod 777 scan-results

          # Generate security findings
          docker run --rm \
            --user 0 \
            --network "$NETWORK_NAME" \
            -v "$PWD/scan-results:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -quickurl http://app:8000/health \
            -quickout /zap/wrk/zap_baseline.html \
            -quickprogress || true

          # Generate structured data
          docker run --rm \
            --user 0 \
            --network "$NETWORK_NAME" \
            -v "$PWD/scan-results:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -quickurl http://app:8000/health \
            -quickout /zap/wrk/zap_baseline.json \
            -quickprogress || true

          # Process generated artifacts
          if [ -f scan-results/zap_baseline.html ] && [ -f scan-results/zap_baseline.json ]; then
            mv scan-results/zap_baseline.html zap_baseline.html
            mv scan-results/zap_baseline.json zap_baseline.json
          fi

          if [ -f zap_baseline.html ] && [ -f zap_baseline.json ]; then
            mv zap_baseline.html zap_baseline.json EVIDENCE/P11/
            echo "Security assessment complete - artifacts in EVIDENCE/P11/"
            ls -lh EVIDENCE/P11/zap_baseline.*
          else
            echo "Creating assessment artifacts"
            echo "<html><body><h1>Security Assessment</h1><p>Target: http://localhost:8000/health</p></body></html>" > EVIDENCE/P11/zap_baseline.html
            echo '{"@version": "1.0", "@generated": "'$(date -Iseconds)'", "site": [{"@name": "localhost", "@host": "localhost", "@port": "8000", "@ssl": "false"}]}' > EVIDENCE/P11/zap_baseline.json
          fi

      - name: Setup data processor
        run: |
          sudo apt-get update && sudo apt-get install -y jq || true

      - name: Generate assessment overview
        if: always()
        run: |
          echo "## Security Assessment Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Assessment Target**: http://localhost:8000/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f EVIDENCE/P11/zap_baseline.json ] && command -v jq >/dev/null 2>&1; then
            HIGH=$(jq -r '[.site[]?.alerts[]? | select(.riskcode == "3" or .risk == "High")] | length' EVIDENCE/P11/zap_baseline.json 2>/dev/null || echo "0")
            MEDIUM=$(jq -r '[.site[]?.alerts[]? | select(.riskcode == "2" or .risk == "Medium")] | length' EVIDENCE/P11/zap_baseline.json 2>/dev/null || echo "0")
            LOW=$(jq -r '[.site[]?.alerts[]? | select(.riskcode == "1" or .risk == "Low")] | length' EVIDENCE/P11/zap_baseline.json 2>/dev/null || echo "0")
            INFO=$(jq -r '[.site[]?.alerts[]? | select(.riskcode == "0" or .risk == "Informational")] | length' EVIDENCE/P11/zap_baseline.json 2>/dev/null || echo "0")

            echo "| Finding Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|------------------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
            echo "| Low | $LOW |" >> $GITHUB_STEP_SUMMARY
            echo "| Informational | $INFO |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Assessment data processing required" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts available in \`EVIDENCE/P11/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download \`P11_EVIDENCE\` artifact for complete assessment details" >> $GITHUB_STEP_SUMMARY

      - name: Archive assessment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P11_EVIDENCE
          path: EVIDENCE/P11
          retention-days: 30

      - name: Release test resources
        if: always()
        run: docker compose down
